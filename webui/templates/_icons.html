{# Inline SVG icon set. Inline rather than a font or sprite so the page stays a
   single self-contained request and works with no network at all. #}

{% macro icon(name, size=18) -%}
<svg class="ico" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
     aria-hidden="true" focusable="false">
{%- if name == 'home' -%}
  <path d="M3 10.2 12 3l9 7.2V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>
{%- elif name == 'history' -%}
  <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3.5 2"/>
{%- elif name == 'settings' -%}
  <circle cx="12" cy="12" r="3.2"/>
  <path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>
{%- elif name == 'doc' -%}
  <path d="M14 2H6.5A1.5 1.5 0 0 0 5 3.5v17A1.5 1.5 0 0 0 6.5 22h11a1.5 1.5 0 0 0 1.5-1.5V7z"/>
  <path d="M14 2v5h5"/>
{%- elif name == 'search' -%}
  <circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>
{%- elif name == 'wand' -%}
  <path d="m14 6 4 4L7 21l-4-4z"/><path d="M18 2v4M20 4h-4M6 14l4 4"/>
{%- elif name == 'check' -%}
  <circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/>
{%- elif name == 'alert' -%}
  <path d="M10.3 3.6 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.6a2 2 0 0 0-3.4 0z"/>
  <path d="M12 9v4.5M12 17.2v.01"/>
{%- elif name == 'clock' -%}
  <circle cx="12" cy="12" r="9"/><path d="M12 7v5.2l3.4 2"/>
{%- elif name == 'inbox' -%}
  <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7"/>
  <path d="M3 12h5l1.5 2.5h5L16 12h5L18.6 4.4A2 2 0 0 0 16.7 3H7.3a2 2 0 0 0-1.9 1.4z"/>
{%- elif name == 'play' -%}
  <path d="M7 4.8v14.4a1 1 0 0 0 1.5.87l11.6-7.2a1 1 0 0 0 0-1.74L8.5 3.93A1 1 0 0 0 7 4.8z"/>
{%- elif name == 'eye' -%}
  <path d="M2 12s3.8-7 10-7 10 7 10 7-3.8 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>
{%- elif name == 'x' -%}
  <circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/>
{%- elif name == 'sun' -%}
  <circle cx="12" cy="12" r="4"/>
  <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
{%- elif name == 'moon' -%}
  <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
{%- elif name == 'auto' -%}
  <circle cx="12" cy="12" r="9"/><path d="M12 3v18" fill="currentColor"/>
{%- elif name == 'cpu' -%}
  <rect x="6" y="6" width="12" height="12" rx="2"/>
  <path d="M10 2v4M14 2v4M10 18v4M14 18v4M2 10h4M2 14h4M18 10h4M18 14h4"/>
{%- elif name == 'calendar' -%}
  <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>
{%- elif name == 'folder' -%}
  <path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
{%- elif name == 'sparkle' -%}
  <path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/>
  <path d="M18.5 16.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/>
{%- endif -%}
</svg>
{%- endmacro %}
